name: 构建 Windows 版股权树生成器

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - 'v*'         # 推送标签时自动构建

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: |
          pip install pyinstaller openpyxl
      
      - name: 打包为 exe
        run: |
          pyinstaller --onefile --windowed `
            --name "股权树生成器" `
            --add-data "templates;templates" `
            --distpath dist `
            --workpath build `
            --noconfirm `
            equity_tree_gui.py
      
      - name: 创建压缩包
        run: |
          cd dist
          Compress-Archive -Path "股权树生成器.exe" -DestinationPath "股权树生成器_Windows.zip" -Force
      
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 股权树生成器-Windows
          path: dist/股权树生成器_Windows.zip